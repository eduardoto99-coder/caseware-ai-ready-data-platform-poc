name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -q

      - name: Run type checking
        run: mypy

      - name: Run routing eval
        run: python evals/eval_routing.py

      - name: Run chunking eval
        run: python evals/eval_chunking.py

      - name: Run guardrail eval
        run: python evals/eval_guardrails.py

      - name: Run retrieval eval
        run: python evals/eval_retrieval.py

      - name: Check formatting
        run: ruff format --check src/ tests/ evals/

      - name: Check linting
        run: ruff check src/ tests/ evals/
