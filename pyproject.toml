[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caseware-ai-ready-platform-poc"
version = "0.1.0"
description = "Multi-tenant AI-ready accounting data platform reference implementation for a Caseware-style technical challenge."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "Eduardo Blandon" }
]
dependencies = [
  "pydantic>=2.12.5",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
]
reference = [
  "aws-cdk-lib>=2.160.0",
  "boto3>=1.38.0",
  "confluent-kafka>=2.8.2",
  "constructs>=10.4.2",
  "langfuse>=2.60.3",
  "langgraph>=0.4.5",
  "newrelic>=10.11.0",
  "opensearch-py>=2.8.0",
  "pgvector>=0.4.1",
  "pymongo>=4.10.1",
  "psycopg[binary]>=3.2.9",
  "pyspark>=3.5.5",
  "trino>=0.336.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["caseware_poc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
